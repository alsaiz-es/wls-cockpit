name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      # postinstall runs `npm run gen`, which reads the vendored specs from ../openapi.
      - run: npm ci
      - run: npm run lint
      # The unit tests use --experimental-strip-types, which Node 20 does not support.
      - run: npm run test:unit
        if: matrix.node != 20
      - run: npx tsc -b --force
      - run: npm run build
